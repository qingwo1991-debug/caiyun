name: Publish images

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'release-*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          SAFE_TAG="$(printf '%s' "${GITHUB_REF_NAME:-ci}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9_.-]+#-#g; s#^[.-]+##; s#[.-]+$##' | cut -c1-120)"
          test -n "$SAFE_TAG" || SAFE_TAG=ci
          echo "IMAGE_TAG=$SAFE_TAG" >> "$GITHUB_ENV"

      - name: Generate frontend API contracts
        run: |
          python3 scripts/generate-openapi-local.py
          python3 scripts/generate-asyncapi-local.py
          python3 scripts/generate-api-client-types.py

      - name: Build unified backend image
        run: >-
          docker build -f backend/Dockerfile
          --build-arg TARGETARCH=amd64
          --build-arg VERSION=${IMAGE_TAG}
          --build-arg COMMIT=${{ github.sha }}
          --build-arg BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          -t "${IMAGE_PREFIX}/caiyun-backend:${IMAGE_TAG}"
          -t "${IMAGE_PREFIX}/caiyun-backend:latest"
          backend

      - name: Build frontend image
        run: >-
          docker build -f frontend/Dockerfile
          -t "${IMAGE_PREFIX}/caiyun-frontend:${IMAGE_TAG}"
          -t "${IMAGE_PREFIX}/caiyun-frontend:latest"
          .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR
        run: |
          docker push "${IMAGE_PREFIX}/caiyun-backend:${IMAGE_TAG}"
          docker push "${IMAGE_PREFIX}/caiyun-backend:latest"
          docker push "${IMAGE_PREFIX}/caiyun-frontend:${IMAGE_TAG}"
          docker push "${IMAGE_PREFIX}/caiyun-frontend:latest"
